<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>第四座金山｜風險控管與報單</title><style>
:root{font-family:system-ui,-apple-system,"Noto Sans TC",sans-serif;color:#ffe9c1;background:#102139}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top,#38556e,#0d172a 75%)}button,input{font:inherit}button{cursor:pointer}.wrap{max-width:1050px;margin:18px auto 35px;padding:24px;border:5px solid #cb9348;border-radius:28px;background:linear-gradient(155deg,#493025,#241b1b)}.top{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}.tag{border:2px solid #b77c36;background:#422818;border-radius:13px;padding:10px 16px;font-weight:800}.gold{border:2px solid #ab6d16;background:linear-gradient(#ffe779,#f8b42c);color:#532b00;font-weight:900;border-radius:14px;padding:12px 18px;box-shadow:0 5px #a7610f}.gold:hover{filter:brightness(1.08)}h1{text-align:center;color:#ffdf73;font-size:clamp(28px,4vw,44px)}h2{color:#ffe38d;font-size:clamp(22px,3vw,30px)}p{line-height:1.7}.muted{color:#ddc6a0;text-align:center}.levels{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:20px 0}.level{border:2px solid #86603a;background:#30231d;color:#f9dfb4;padding:12px 6px;border-radius:12px;font-size:14px;font-weight:750}.level.active{border-color:#ffdf65;background:#6c441d}.level.done{background:#24513a;border-color:#62d7a0}.panel{background:#241e1d;border:2px solid #b08245;border-radius:22px;padding:24px}.mentorline{display:flex;align-items:center;gap:15px}.mentor{width:85px;height:85px;object-fit:cover;animation:bob 3s ease-in-out infinite}.speech{flex:1;background:#51331d;border:2px solid #dca553;border-radius:16px;padding:13px;font-weight:750}.lesson{background:#382a20;border-left:5px solid #ffd16b;padding:14px 18px;border-radius:8px;margin:16px 0}.choices{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin:20px 0}.choice{padding:15px;background:#3e2c22;color:#ffe9c0;border:2px solid #a47845;border-radius:13px;font-weight:800}.choice:hover{border-color:#ffe48b}.feedback{padding:15px;border-radius:13px;border:2px solid #b88648;background:#493120;margin:14px 0;font-weight:750;line-height:1.65}.feedback.good{background:#194f39;border-color:#62dba0}.actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:18px}.outline{background:#33241d;border:2px solid #b58a51;color:#ffe8b9;border-radius:14px;padding:11px 17px;font-weight:800}.slider{width:100%;accent-color:#ffcf4f}.number{font-size:22px;font-weight:900;color:#ffe187}.riskbox{background:#142631;border:2px solid #557c87;border-radius:17px;padding:20px;margin:14px 0}.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.metric{padding:15px;background:#203540;border-radius:12px;text-align:center}.metric strong{display:block;font-size:23px;color:#ffdc76;margin-top:6px}.progress{height:12px;background:#25180d;border:1px solid #c58c3d;border-radius:20px;overflow:hidden;margin:12px 0}.progress>div{height:100%;background:linear-gradient(90deg,#ffc339,#fff096)}.footer{text-align:center;color:#d4bd9c;font-size:12px;margin:16px}.chart svg{width:100%;height:auto;display:block}.order{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.order label{display:block;margin:10px 0}.order input{width:100%;padding:12px;background:#182d39;border:2px solid #61828a;border-radius:9px;color:#fff}.order .full{grid-column:1/-1}.result{font-size:20px;font-weight:800;color:#ffe187}@keyframes bob{50%{transform:translateY(-7px)}}@media(max-width:650px){.wrap{margin:6px;padding:12px}.panel{padding:13px}.levels{grid-template-columns:repeat(2,1fr)}.choices,.order{grid-template-columns:1fr}.metrics{grid-template-columns:1fr}.mentor{width:64px;height:64px}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style><style id="v29-embedded-game-quiz">
.lesson{font-size:clamp(16px,3.8vw,19px);line-height:1.8;background:#203241;border-left:5px solid #efbd4c;border-radius:12px;padding:15px;margin:12px 0 18px;color:#fff0ca}
.choices{display:grid!important;grid-template-columns:1fr!important;gap:10px!important;justify-content:stretch!important;border:4px solid #ad742e;background:linear-gradient(160deg,#573820,#2c1e18);border-radius:20px;padding:16px;margin:16px 0!important;box-shadow:inset 0 0 0 2px #e4b85b,0 7px 18px #0006}
.choices::before{content:"⛏ 挖礦小挑戰｜選出正確答案";font-size:clamp(15px,4vw,19px);font-weight:900;text-align:center;color:#57320d;background:linear-gradient(#ffe69b,#f1b63e);border-radius:22px;padding:9px 12px;border:2px solid #b87520;margin-bottom:3px}
.choices button.choice{display:block!important;text-align:left!important;min-height:52px!important;padding:12px 15px!important;margin:0!important;background:linear-gradient(#76502d,#59381f)!important;border:2px solid #bd8a44!important;border-radius:13px!important;color:#fff0d3!important;font-size:clamp(15px,3.9vw,18px)!important;font-weight:850!important;box-shadow:0 4px 0 #24140c!important;white-space:normal}
.choices button.choice:hover,.choices button.choice:focus-visible{outline:2px solid #ffe58d;filter:brightness(1.1)}
.feedback{line-height:1.65!important;font-size:clamp(14px,3.6vw,17px)!important}
@media(max-width:600px){.choices{padding:11px!important;border-width:3px!important}.wrap{padding-left:9px!important;padding-right:9px!important}}
</style></head><body><main class="wrap"><div class="top"><span class="tag">⛏ 第四座金山｜風險控管與報單</span><span class="tag" id="player"></span><button class="outline" id="reset">重玩本座金山</button></div><h1>守住金幣的冒險</h1><p class="muted">先學停損 → 算風險 → 模擬報單 → 挑戰通關</p><div class="progress"><div id="progress"></div></div><nav class="levels" id="levels"></nav><section class="panel"><div class="mentorline"><img class="mentor" src="mentor.png" alt="礦工導師"><div class="speech" id="speech"></div></div><div id="content"></div></section><p class="footer">僅供模擬教學。所有金額與價格皆為虛構，不代表即時行情；實際商品規格與合約價值請以券商為準。</p></main><script>
const $=id=>document.getElementById(id),names=['為什麼停損','停損在哪裡','一筆能賠多少','風險報酬比','模擬報單','下單前檢查'];let done=new Set;try{done=new Set(JSON.parse(localStorage.getItem('gold_mountain4_v21')||'[]'))}catch(e){}let stage=0,sl=15,tp=30,risk=1,orderType='buy';const player=localStorage.getItem('gold_miner_name')||'新手礦工';$('player').textContent='礦工：'+player;function save(){localStorage.setItem('gold_mountain4_v21',JSON.stringify([...done]))}function go(i){stage=i;ui();scrollTo({top:0,behavior:'smooth'})}function next(){done.add(stage);save();if(stage<5)go(stage+1);else{stage=6;ui()}}function btn(label='完成挑戰，下一關 ▶'){return `<div class="actions"><button class="gold" onclick="next()">${label}</button></div>`}function info(s){return `<div class="lesson">${s}</div>`}function result(ok,msg){const el=$('feedback');if(el.dataset.answered)return;el.className='feedback'+(ok?' good':'');el.innerHTML=msg+(ok?'<p>✓ 即將進入下一段教學。</p>':'');if(ok){el.dataset.answered='1';const at=stage;setTimeout(()=>{if(stage===at)next()},1350)}}function ask(q,options,correct,why){return `<h3>${q}</h3><div class="choices">${options.map((o,i)=>`<button class="choice" onclick="result(${i===correct},'${(i===correct?'答對！':'再想想：')+why}')">${o}</button>`).join('')}</div><div class="feedback" id="feedback">選一個答案。</div>`}function chart(){return `<div class="riskbox chart"><svg viewBox="0 0 850 280" aria-label="價格走勢與進場停損止盈線"><g stroke="#3e5a66" stroke-dasharray="6 7">${[55,110,165,220].map(y=>`<line x1="60" y1="${y}" x2="800" y2="${y}"/>`).join('')}</g><polyline points="70,170 170,142 270,163 370,120 470,140 570,85 670,106 780,72" fill="none" stroke="#58d3ee" stroke-width="6" stroke-linejoin="round"/><line x1="60" y1="125" x2="800" y2="125" stroke="#ffdf75" stroke-width="3" stroke-dasharray="8 6"/><text x="70" y="118" fill="#ffdf75" font-size="20">進場 4000（示意）</text><line x1="60" y1="${125+sl*3}" x2="800" y2="${125+sl*3}" stroke="#ff7676" stroke-width="3" stroke-dasharray="8 6"/><text x="600" y="${125+sl*3-8}" fill="#ffaaaa" font-size="20">停損 ${4000-sl}</text><line x1="60" y1="${125-tp*2}" x2="800" y2="${125-tp*2}" stroke="#7ee3ac" stroke-width="3" stroke-dasharray="8 6"/><text x="600" y="${125-tp*2-8}" fill="#a9ffd0" font-size="20">止盈 ${4000+tp}</text></svg></div>`}function calc(){sl=+$('sl').value;tp=+$('tp').value;$('slv').textContent=sl;$('tpv').textContent=tp;$('ratio').textContent='1 : '+(tp/sl).toFixed(1);$('chart').innerHTML=chart()}function riskCalc(){risk=+$('risk').value;$('riskv').textContent=risk;$('maxloss').textContent=(1000*risk/100).toFixed(0)}function orderCalc(){let entry=+$('entry').value,stop=+$('stop').value,target=+$('target').value,kind=$('side').value;let valid=Number.isFinite(entry)&&Number.isFinite(stop)&&Number.isFinite(target)&&entry>0&&stop>0&&target>0&&(kind==='buy'?stop<entry&&target>entry:stop>entry&&target<entry);let msg=valid?`✓ 方向正確。每單位價格風險：${Math.abs(entry-stop).toFixed(1)}；預期報酬：${Math.abs(target-entry).toFixed(1)}；風報比 1 : ${(Math.abs(target-entry)/Math.abs(entry-stop)).toFixed(1)}。`:'⚠ 價格位置不正確：買進時停損要低於進場、止盈要高於進場；賣出時相反。';$('orderFeedback').textContent=msg;$('orderNext').hidden=!valid}
function ui(){$('progress').style.width=(done.size/6*100)+'%';$('levels').innerHTML=names.map((n,i)=>`<button class="level ${i===stage?'active':''} ${done.has(i)?'done':''}" onclick="go(${i})">${done.has(i)?'✓ ':''}${i+1}. ${n}</button>`).join('');const s=['賺錢很重要，但先學會控制每次可能的虧損。','停損是事先想好的退出位置，不是虧損後才決定。','每次只冒自己承受得起的風險。','先看可能賠多少，再看可能賺多少。','來填一張模擬單，親自檢查停損止盈。','最後一關：出手前確認三件事。','恭喜！你已經完成風險守護挑戰。'];$('speech').textContent=s[Math.min(stage,6)];let h='';switch(stage){case 0:h='<h2>第一關｜為什麼需要停損？</h2>'+info('停損（SL）：價格走到事先設定的位置，就接受小虧離場，避免虧損繼續擴大。')+ask('你買進後，價格持續下跌。哪種做法比較符合風險控管？',['一直加碼，等它漲回來','事先設定停損並遵守','把停損刪掉','只看獲利目標'],1,'先規劃最大損失，避免情緒化加碼。');break;case 1:h='<h2>第二關｜停損與止盈放在哪？</h2>'+info('看圖理解：在<b>買進單</b>中，停損 SL 設在進場下方，止盈 TP 設在進場上方。設定前，要先想自己願意承受多少風險。')+chart()+ask('買進單的停損與止盈，哪一種位置最合理？',['SL 在進場下方，TP 在進場上方','SL 在進場上方，TP 在進場下方','都不用設定'],0,'買進單通常把 SL 放在進場下方，TP 放在進場上方。');break;case 2:h='<h2>第三關｜一筆交易最多能賠多少？</h2>'+info('假設模擬資金為 <b>1,000 美元</b>。把單筆風險控制在自己事先設定的比例。')+`<div class="riskbox"><div class="metrics"><div class="metric">模擬資金<strong>$1,000</strong></div><div class="metric">風險比例<strong><span id="riskv">${risk}</span>%</strong></div><div class="metric">單筆最大計畫虧損<strong>$<span id="maxloss">${1000*risk/100}</span></strong></div></div><p>拖動黃球調整風險比例</p><input class="slider" id="risk" type="range" min="0.5" max="5" step="0.5" value="${risk}" oninput="riskCalc()"></div>`+ask('模擬資金 $1,000，單筆風險 1%，最多計畫虧損多少？',['$10','$100','$500','$1,000'],0,'1,000 × 1% = 10 美元。');break;case 3:h='<h2>第四關｜風險報酬比</h2>'+info('風險報酬比 1:2，意思是：<b>預計承擔 10 點風險，目標獲得 20 點</b>。這不是獲利保證。')+`<div class="riskbox"><div class="metrics"><div class="metric">預計虧損<strong>10 點</strong></div><div class="metric">預計獲利<strong>20 點</strong></div><div class="metric">風報比<strong>1 : 2</strong></div></div></div>`+ask('如果停損距離 15 點、止盈距離 30 點，風報比是多少？',['1 : 1','1 : 2','2 : 1','1 : 5'],1,'30 ÷ 15 = 2，所以是 1:2。');break;case 4:h='<h2>第五關｜模擬填寫一張報單</h2>'+info('買進（Buy）預期上漲；賣出（Sell）預期下跌。先選方向，再填進場、停損（SL）、止盈（TP）。這只是練習，<b>不會送出真實訂單</b>。')+`<div class="riskbox order"><label>方向<select id="side" onchange="orderCalc()" style="width:100%;padding:12px;background:#182d39;color:white;border:2px solid #61828a;border-radius:9px"><option value="buy">Buy 買進</option><option value="sell">Sell 賣出</option></select></label><label>進場價格<input id="entry" type="number" value="4000" oninput="orderCalc()"></label><label>停損 SL<input id="stop" type="number" value="3990" oninput="orderCalc()"></label><label>止盈 TP<input id="target" type="number" value="4020" oninput="orderCalc()"></label><div class="full"><button class="gold" onclick="orderCalc()">檢查模擬報單</button><div class="feedback" id="orderFeedback">按下檢查，確認價格位置。</div><div id="orderNext" hidden>${btn('完成模擬報單 ▶')}</div></div></div>`;break;case 5:h='<h2>第六關｜下單前最後檢查</h2>'+info('一張完整的交易計畫，至少知道<b>為什麼進場、錯了在哪裡離場、最多可能賠多少</b>。')+ask('下單前，哪一項最重要？',['先確認進場理由、停損與風險','先把槓桿開到最大','不用設定停損','只要看 MACD 就夠了'],0,'先規劃交易，再決定是否執行。');break;default:h=`<div style="text-align:center"><h2>🏆 第四座金山通關！</h2><img src="mentor.png" alt="礦工導師" style="max-width:160px"><p class="result">${player}，你完成了 ${done.size}/6 關！</p><p>你學會了停損、風險比例、風險報酬比與模擬報單。</p><p>恭喜完成本座金山！返回金山地圖，即可查看新解鎖的恐龍。</p><button class="gold" onclick="go(0)">再次練習</button></div>`}$('content').innerHTML=h;if(stage===6){parent.postMessage({type:'mountain4',action:'completed'},'*')}}
$('reset').onclick=()=>{if(confirm('清除第四座金山的試玩進度？')){done.clear();save();go(0)}};ui();
</script></body></html>
