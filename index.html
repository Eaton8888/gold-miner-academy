<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#18273c"><title>黃金礦工學院｜基礎測試版</title>
<style>
:root{color-scheme:dark;font-family:system-ui,-apple-system,"Noto Sans TC",sans-serif}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#385477,#121d31 70%);color:#fff6df;min-height:100vh}button{font:inherit;cursor:pointer;border:0}header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 20px;background:#111d30bb;position:sticky;top:0;z-index:5}header strong{font-size:clamp(17px,3vw,25px)}.btn{background:linear-gradient(#ffdc70,#d58a28);border:2px solid #ffedab;border-radius:12px;color:#30200e;font-weight:800;padding:12px 17px;min-height:46px}.btn:focus-visible{outline:3px solid #fff}.btn:disabled{filter:grayscale(1);opacity:.6;cursor:not-allowed}main{max-width:1080px;margin:auto;padding:20px}.hero{text-align:center;border:5px solid #b77d31;border-radius:25px;background:linear-gradient(135deg,#65452b,#362419);padding:30px 18px;box-shadow:0 18px 35px #0006}.hero h1{font-size:clamp(28px,5vw,52px);margin:10px 0}.hero p{color:#ffe6b2}.mountains{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px;margin-top:28px}.mountain{background:#273a46;border:3px solid #ba9049;border-radius:20px;min-height:180px;padding:16px 8px;color:white;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:12px}.mountain .emoji{font-size:clamp(32px,5vw,62px)}.mountain b{font-size:clamp(13px,1.6vw,20px)}.mountain span{font-size:13px;color:#f7cf85}.mountain:disabled{opacity:.62}.panel{max-width:760px;margin:20px auto;background:#302b29;border:3px solid #bc904f;border-radius:20px;padding:clamp(18px,4vw,32px)}.panel h2{margin-top:0}.panel p{line-height:1.85}.answers{display:grid;gap:12px;margin:24px 0}.answer{padding:16px;text-align:left;border:2px solid #b58b50;background:#4c4033;color:#fff;border-radius:12px;min-height:52px}.answer.selected{background:#6a5933;border-color:#ffe58c}.feedback{padding:14px;background:#1d3a34;border-radius:10px;margin:12px 0}.gallery{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.dino{border:4px solid #c69c53;background:#251f20;border-radius:18px;text-align:center;padding:20px 8px}.dino .face{font-size:clamp(38px,7vw,68px)}.dino.locked{filter:grayscale(1);opacity:.5}.note{color:#f6c978;font-size:14px}.controls{display:flex;gap:10px;flex-wrap:wrap}.hidden{display:none!important}@media(max-width:700px){header{padding:12px}main{padding:12px}.mountains{grid-template-columns:repeat(2,minmax(0,1fr))}.mountain{min-height:150px}.gallery{grid-template-columns:repeat(2,1fr)}.hero{padding:18px 10px}.btn{padding:10px 12px}}@media(max-width:350px){.mountains{grid-template-columns:1fr}.gallery{grid-template-columns:1fr}}
</style></head><body><header><strong>⛏️ 黃金礦工學院</strong><button class="btn" id="homeBtn">⌂ 返回首頁</button></header><main>
<section id="home"><div class="hero"><div style="font-size:60px">⛏️ 🦖 🏔️</div><h1>五座金山的交易冒險</h1><p>從零開始學習 XAUUSD 黃金交易</p><p id="progress"></p><button class="btn" id="continueBtn">開始冒險</button> <button class="btn" id="galleryBtn">🦕 恐龍圖鑑</button><div class="mountains" id="mountains"></div></div><p class="note">基礎測試版：此頁暫用可運作的介面；已核准的 3D 首頁圖片尚未移入 GitHub，正式美術不會擅自替換。</p></section>
<section id="lesson" class="hidden"><div class="panel"><p id="step"></p><h2 id="lessonTitle"></h2><p id="lessonText"></p><div id="answers" class="answers"></div><p id="feedback" class="feedback hidden"></p><div class="controls"><button class="btn" id="prevBtn">上一題</button><button class="btn" id="nextBtn" disabled>下一題</button></div></div></section>
<section id="gallery" class="hidden"><div class="panel"><h2>🦕 恐龍收藏圖鑑</h2><p>完成前三座金山可依序解鎖恐龍；獎勵只會領取一次。</p><div class="gallery" id="dinos"></div></div></section>
</main><script>
"use strict";
const lessons=[
[{t:"K 棒是什麼？",x:"每根 K 棒顯示一段時間內的開盤、最高、最低、收盤價格。",q:["四個價格","只有收盤價","只有成交量"],a:0},{t:"看懂陽線與陰線",x:"一般來說，收盤高於開盤是上漲 K 棒；不同平台顏色可能相反，請看價格而不是只看顏色。",q:["比較開盤與收盤","只看影線長短","看恐龍顏色"],a:0}],
[{t:"上升趨勢",x:"價格若持續形成更高的高點與更高的低點，常被視為上升趨勢。",q:["高點與低點逐步墊高","每根 K 棒都一樣","只要出現一根陽線"],a:0},{t:"支撐與壓力",x:"支撐是買盤可能較積極的區域，壓力是賣盤可能較積極的區域；兩者都不是必然有效。",q:["可能反應的價格區域","保證反轉的價位","永遠不會突破"],a:0}],
[{t:"MACD 基礎",x:"常見 MACD 主線為 12 期 EMA 減去 26 期 EMA，訊號線通常是 MACD 的 9 期 EMA。",q:["兩條 EMA 的差","價格與成交量相乘","固定獲利保證"],a:0},{t:"金叉與背離",x:"MACD 主線上穿訊號線稱金叉；價格與指標高低點方向不一致可能形成背離，但都不能單獨保證進場成功。",q:["需要搭配趨勢與風控","金叉一定賺錢","背離一定反轉"],a:0}]
];
const mountainNames=["K 棒入門","趨勢與支撐壓力","MACD 技術指標","風險控管與報單","實戰模擬"];
const key="gold-miner-academy-test-v1";let state;try{state=JSON.parse(localStorage.getItem(key))||{done:[false,false,false],level:0,step:0}}catch{state={done:[false,false,false],level:0,step:0}};if(!Array.isArray(state.done))state.done=[false,false,false];let picked=false;
const el=id=>document.getElementById(id),save=()=>{try{localStorage.setItem(key,JSON.stringify(state))}catch{}};
function show(id){for(const x of ["home","lesson","gallery"])el(x).classList.toggle("hidden",x!==id);if(id==="home")renderHome();if(id==="gallery")renderGallery();window.scrollTo(0,0)}
function renderHome(){const next=state.done.findIndex(v=>!v);el("progress").textContent="已完成 "+state.done.filter(Boolean).length+"/3 座可玩金山";el("continueBtn").textContent=next<0?"查看已完成課程":"前往第 "+(next+1)+" 座金山";el("mountains").innerHTML="";mountainNames.forEach((n,i)=>{const b=document.createElement("button");b.className="mountain";b.disabled=i>2;b.innerHTML='<div class="emoji">'+["⛏️","🏔️","📊","🛡️","🏆"][i]+'</div><b>第'+(i+1)+'座｜'+n+'</b><span>'+(i>2?"開發中":state.done[i]?"✓ 已完成・可複習":"點擊開始")+"</span>";b.onclick=()=>start(i);el("mountains").append(b)})}
function start(i){if(i>2)return;state.level=i;state.step=0;save();renderLesson();show("lesson")}
function renderLesson(){picked=false;const l=lessons[state.level][state.step];el("step").textContent="第 "+(state.level+1)+" 座金山 · 第 "+(state.step+1)+"/"+lessons[state.level].length+" 課";el("lessonTitle").textContent=l.t;el("lessonText").textContent=l.x;el("answers").innerHTML="";el("feedback").classList.add("hidden");el("nextBtn").disabled=true;el("nextBtn").textContent=state.step===lessons[state.level].length-1?"完成金山":"下一題";el("prevBtn").disabled=state.step===0;l.q.forEach((q,i)=>{const b=document.createElement("button");b.className="answer";b.textContent=q;b.onclick=()=>{if(picked)return;picked=true;b.classList.add("selected");const ok=i===l.a;el("feedback").textContent=ok?"答對了！可以繼續。":"還差一點。正確答案："+l.q[l.a];el("feedback").classList.remove("hidden");el("nextBtn").disabled=!ok;if(!ok){picked=false;b.classList.remove("selected")}};el("answers").append(b)})}
function renderGallery(){el("dinos").innerHTML="";["暴龍","迅猛龍","三角龍","雷龍","翼龍","劍龍"].forEach((n,i)=>{const unlocked=i>=1&&i<=3&&state.done[i-1];const d=document.createElement("div");d.className="dino"+(unlocked?"":" locked");d.innerHTML='<div class="face">'+(unlocked?["","🦖","🦕","🦕"][i]:"🔒")+'</div><div>'+n+'</div>';el("dinos").append(d)})}
el("homeBtn").onclick=()=>show("home");el("galleryBtn").onclick=()=>show("gallery");el("continueBtn").onclick=()=>{const i=state.done.findIndex(v=>!v);start(i<0?0:i)};el("prevBtn").onclick=()=>{if(state.step>0){state.step--;save();renderLesson()}};el("nextBtn").onclick=()=>{if(state.step+1<lessons[state.level].length){state.step++;save();renderLesson()}else{state.done[state.level]=true;save();show("gallery")}};show("home");
</script></body></html>
