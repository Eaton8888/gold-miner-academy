<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>第五座金山｜黃金實戰模擬</title><style>
:root{font-family:system-ui,-apple-system,"Noto Sans TC",sans-serif;color:#ffe9c1;background:#102139}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top,#38556e,#0d172a 75%)}button,input{font:inherit}button{cursor:pointer}.wrap{max-width:1050px;margin:18px auto 35px;padding:24px;border:5px solid #cb9348;border-radius:28px;background:linear-gradient(155deg,#493025,#241b1b)}.top{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}.tag{border:2px solid #b77c36;background:#422818;border-radius:13px;padding:10px 16px;font-weight:800}.gold{border:2px solid #ab6d16;background:linear-gradient(#ffe779,#f8b42c);color:#532b00;font-weight:900;border-radius:14px;padding:12px 18px;box-shadow:0 5px #a7610f}.gold:hover{filter:brightness(1.08)}h1{text-align:center;color:#ffdf73;font-size:clamp(28px,4vw,44px)}h2{color:#ffe38d;font-size:clamp(22px,3vw,30px)}p{line-height:1.7}.muted{color:#ddc6a0;text-align:center}.levels{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:20px 0}.level{border:2px solid #86603a;background:#30231d;color:#f9dfb4;padding:12px 6px;border-radius:12px;font-size:14px;font-weight:750}.level.active{border-color:#ffdf65;background:#6c441d}.level.done{background:#24513a;border-color:#62d7a0}.panel{background:#241e1d;border:2px solid #b08245;border-radius:22px;padding:24px}.mentorline{display:flex;align-items:center;gap:15px}.mentor{width:85px;height:85px;object-fit:cover;animation:bob 3s ease-in-out infinite}.speech{flex:1;background:#51331d;border:2px solid #dca553;border-radius:16px;padding:13px;font-weight:750}.lesson{background:#382a20;border-left:5px solid #ffd16b;padding:14px 18px;border-radius:8px;margin:16px 0}.choices{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin:20px 0}.choice{padding:15px;background:#3e2c22;color:#ffe9c0;border:2px solid #a47845;border-radius:13px;font-weight:800}.choice:hover{border-color:#ffe48b}.feedback{padding:15px;border-radius:13px;border:2px solid #b88648;background:#493120;margin:14px 0;font-weight:750;line-height:1.65}.feedback.good{background:#194f39;border-color:#62dba0}.actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:18px}.outline{background:#33241d;border:2px solid #b58a51;color:#ffe8b9;border-radius:14px;padding:11px 17px;font-weight:800}.slider{width:100%;accent-color:#ffcf4f}.number{font-size:22px;font-weight:900;color:#ffe187}.riskbox{background:#142631;border:2px solid #557c87;border-radius:17px;padding:20px;margin:14px 0}.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.metric{padding:15px;background:#203540;border-radius:12px;text-align:center}.metric strong{display:block;font-size:23px;color:#ffdc76;margin-top:6px}.progress{height:12px;background:#25180d;border:1px solid #c58c3d;border-radius:20px;overflow:hidden;margin:12px 0}.progress>div{height:100%;background:linear-gradient(90deg,#ffc339,#fff096)}.footer{text-align:center;color:#d4bd9c;font-size:12px;margin:16px}.chart svg{width:100%;height:auto;display:block}.order{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.order label{display:block;margin:10px 0}.order input{width:100%;padding:12px;background:#182d39;border:2px solid #61828a;border-radius:9px;color:#fff}.order .full{grid-column:1/-1}.result{font-size:20px;font-weight:800;color:#ffe187}@keyframes bob{50%{transform:translateY(-7px)}}@media(max-width:650px){.wrap{margin:6px;padding:12px}.panel{padding:13px}.levels{grid-template-columns:repeat(2,1fr)}.choices,.order{grid-template-columns:1fr}.metrics{grid-template-columns:1fr}.mentor{width:64px;height:64px}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}

.chartbox{background:#13232c;border:2px solid #68858c;border-radius:16px;padding:10px}.chartbox svg{width:100%;display:block}.chartlabel{font-size:13px;fill:#fff1c6}.yellow{color:#ffe16d}.controls{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.small{padding:10px 13px}.status{background:#172e33;border:1px solid #68858c;border-radius:12px;padding:13px;line-height:1.6}.note{color:#ffe7b5;line-height:1.6}.side{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.side button{padding:13px;border:2px solid #a47b4d;background:#423022;color:#ffe6af;border-radius:12px;font-weight:900}.side button.selected{border-color:#ffdf64;background:#775020}.hide{display:none!important}@media(max-width:600px){.side{grid-template-columns:1fr}}
</style><style id="v29-embedded-game-quiz">
.lesson{font-size:clamp(16px,3.8vw,19px);line-height:1.8;background:#203241;border-left:5px solid #efbd4c;border-radius:12px;padding:15px;margin:12px 0 18px;color:#fff0ca}
.choices{display:grid!important;grid-template-columns:1fr!important;gap:10px!important;justify-content:stretch!important;border:4px solid #ad742e;background:linear-gradient(160deg,#573820,#2c1e18);border-radius:20px;padding:16px;margin:16px 0!important;box-shadow:inset 0 0 0 2px #e4b85b,0 7px 18px #0006}
.choices::before{content:"⛏ 挖礦小挑戰｜選出正確答案";font-size:clamp(15px,4vw,19px);font-weight:900;text-align:center;color:#57320d;background:linear-gradient(#ffe69b,#f1b63e);border-radius:22px;padding:9px 12px;border:2px solid #b87520;margin-bottom:3px}
.choices button.choice{display:block!important;text-align:left!important;min-height:52px!important;padding:12px 15px!important;margin:0!important;background:linear-gradient(#76502d,#59381f)!important;border:2px solid #bd8a44!important;border-radius:13px!important;color:#fff0d3!important;font-size:clamp(15px,3.9vw,18px)!important;font-weight:850!important;box-shadow:0 4px 0 #24140c!important;white-space:normal}
.choices button.choice:hover,.choices button.choice:focus-visible{outline:2px solid #ffe58d;filter:brightness(1.1)}
.feedback{line-height:1.65!important;font-size:clamp(14px,3.6vw,17px)!important}
@media(max-width:600px){.choices{padding:11px!important;border-width:3px!important}.wrap{padding-left:9px!important;padding-right:9px!important}}
</style></head><body><main class="wrap"><div class="top"><span class="tag">⛏ 第五座金山｜黃金實戰模擬</span><span class="tag" id="player"></span><button class="outline" id="reset">重玩本座金山</button></div><h1>黃金交易實戰冒險</h1><p class="muted">XAUUSD｜H1 一小時圖｜六個互動關卡｜模擬行情</p><div class="progress"><div id="progress"></div></div><nav class="levels" id="levels"></nav><section class="panel"><div class="mentorline"><img class="mentor" src="mentor.png" alt="礦工導師"><div class="speech" id="speech"></div></div><div id="content"></div></section><p class="footer">純教育模擬，不連接券商、不使用真實資金。價格、K 棒與結果均為虛構；圖表時區採示意設定。</p></main><script>
const $=id=>document.getElementById(id);const names=['先看 H1','找出方向','畫支撐壓力','決定做多或做空','規劃 SL / TP','黃金模擬挑戰'];let completed=new Set();try{completed=new Set(JSON.parse(localStorage.getItem('gold_mountain5_v21')||'[]'))}catch{}let stage=0,mode='neutral',lineY=0.5,entry=4050,sl=4040,tp=4070,selected='buy',revealed=false;const player=localStorage.getItem('gold_miner_name')||localStorage.getItem('minerName')||'新手礦工';$('player').textContent='礦工：'+player;
const up=[4025,4031,4028,4038,4035,4044,4040,4050,4046,4058,4053,4065],down=[4072,4066,4070,4059,4062,4052,4056,4044,4048,4039,4041,4032],range=[4042,4055,4045,4052,4040,4056,4047,4054,4041,4053,4044,4051];const scenarios=[{name:'行情 A｜逐步墊高',data:up,trend:'up'},{name:'行情 B｜逐步走低',data:down,trend:'down'},{name:'行情 C｜來回震盪',data:range,trend:'range'}];let scenario=0;
function save(){localStorage.setItem('gold_mountain5_v21',JSON.stringify([...completed]))}function next(){completed.add(stage);save();if(stage<5)go(stage+1);else{stage=6;ui()}}function go(i){stage=i;revealed=false;ui();window.scrollTo({top:0,behavior:'smooth'})}function nextBtn(label='完成挑戰，下一關 ▶'){return `<div class="actions"><button class="gold" onclick="next()">${label}</button></div>`}function info(s){return `<div class="lesson">${s}</div>`}function feedback(ok,message){const el=$('feedback');if(el.dataset.answered)return;el.className='feedback'+(ok?' good':'');el.innerHTML=message+(ok?'<p>✓ 即將進入下一段教學。</p>':'');if(ok){el.dataset.answered='1';const at=stage;setTimeout(()=>{if(stage===at)next()},1350)}}function ask(question,choices,answer,explanation){return `<h3>${question}</h3><div class="choices">${choices.map((c,i)=>`<button class="choice" onclick="feedback(${i===answer},${JSON.stringify((i===answer?'答對！':'再看看：')+explanation).replace(/"/g,'&quot;')})">${c}</button>`).join('')}</div><div class="feedback" id="feedback">點選答案後，礦工導師會解釋原因。</div>`}
function chart(data=up,opts={}){const min=4010,max=4090;const y=v=>245-(v-min)/(max-min)*190;const x=i=>75+i*60;let candles=data.map((v,i)=>{const o=i?data[i-1]:v-3;const high=Math.max(v,o)+3,low=Math.min(v,o)-3;const color=v>=o?'#58d7ac':'#f18379';return `<line x1="${x(i)}" x2="${x(i)}" y1="${y(high)}" y2="${y(low)}" stroke="${color}" stroke-width="3"/><rect x="${x(i)-10}" y="${Math.min(y(v),y(o))}" width="20" height="${Math.max(3,Math.abs(y(v)-y(o)))}" fill="${color}"/>`}).join('');let marks=opts.line?`<line x1="48" x2="790" y1="${y(opts.line)}" y2="${y(opts.line)}" stroke="#ffe16a" stroke-width="3" stroke-dasharray="7 5"/><text x="785" y="${y(opts.line)-9}" text-anchor="end" class="chartlabel">黃金線 ${opts.line.toFixed(1)}</text>`:'';if(opts.order){const levels=[['進場',opts.order.entry,'#ffe16a'],['SL',opts.order.sl,'#ff8585'],['TP',opts.order.tp,'#81e8af']];marks+=levels.map(([label,v,c])=>`<line x1="48" x2="790" y1="${y(v)}" y2="${y(v)}" stroke="${c}" stroke-width="3" stroke-dasharray="7 5"/><text x="780" y="${y(v)-7}" fill="${c}" font-size="15" text-anchor="end">${label} ${v}</text>`).join('')}return `<div class="chartbox"><svg viewBox="0 0 850 295" role="img" aria-label="黃金 H1 模擬 K 線圖"><g stroke="#3c5965" stroke-dasharray="4 7">${[4020,4040,4060,4080].map(v=>`<line x1="48" x2="795" y1="${y(v)}" y2="${y(v)}"/><text x="4" y="${y(v)+5}" fill="#b9d5db" font-size="13">${v}</text>`).join('')}</g>${candles}${marks}<g fill="#dfd4b5" font-size="14">${['一','二','三','四','五','六','日'].map((d,i)=>`<text x="${80+i*110}" y="280">${d}</text>`).join('')}</g></svg></div><p class="note">示意圖：每根 K 棒代表 H1；底部星期標籤僅用來練習辨認交易日，並非每根 K 棒對應一天。</p>`}
function chooseScenario(i){scenario=i;$('chart').innerHTML=chart(scenarios[i].data);$('scenarioLabel').textContent=scenarios[i].name;$('feedback').textContent='觀察高點與低點，再選方向。'}function checkTrend(t){const right=scenarios[scenario].trend===t;feedback(right,right?'答對！上升看高低點墊高；下降看高低點降低；盤整則是在區間內來回。':'再觀察高點、低點是否持續墊高或降低。')}
function lineChange(v){lineY=+v;const price=4020+lineY*50;$('chart').innerHTML=chart(range,{line:price});$('price').textContent=price.toFixed(1);$('explain').textContent=price<4038?'目前畫得偏低：低於這段行情多次回彈的位置。':price<=4044?'這裡接近支撐區：可同時觀察多根 K 棒的下引線低點、實體收盤位置與反彈次數；支撐是一個區域，不保證一定反彈。':price<4050?'這裡在區間中間：不像明顯的支撐或壓力。':price<=4057?'這裡接近壓力區：價格多次漲到附近又回落。':'目前畫得偏高：超過了這段行情常見的反轉位置。'}function checkLine(){const p=4020+lineY*50;feedback(p>=4038&&p<=4044,'找支撐要觀察多次下跌後反彈的區域，也要留意下引線低點。'+(p>=4038&&p<=4044?' 你找到了約 4040 附近的支撐！':' 再把黃球移近 4040。'))}
function chooseSide(s){selected=s;document.querySelectorAll('.side button').forEach(b=>b.classList.toggle('selected',b.dataset.side===s));$('sideNote').textContent=s==='buy'?'做多（Buy）：預期後續上漲，停損應在進場下方。':'做空（Sell）：預期後續下跌，停損應在進場上方。'}function checkSide(){feedback(selected==='buy',selected==='buy'?'正確！這段模擬行情高低點逐步墊高，做多是符合方向的練習選擇；真實交易仍需其他確認。':'這段行情的高低點逐步墊高，先練習順勢觀察做多。')}
function orderUpdate(){entry=+$('entry').value;sl=+$('sl').value;tp=+$('tp').value;const valid=entry>0&&sl>0&&tp>0&&sl<entry&&tp>entry;const ratio=valid?(tp-entry)/(entry-sl):0;$('chart').innerHTML=chart(up,{order:{entry,sl,tp}});$('explain').textContent=valid?`你計畫在 ${entry} 買進，跌到 ${sl} 停損（風險 ${entry-sl} 點），漲到 ${tp} 止盈（目標 ${tp-entry} 點），風報比 1 : ${ratio.toFixed(1)}。`: '買進單的停損要低於進場價，止盈要高於進場價。';$('check').disabled=!valid}function orderCheck(){const ratio=(tp-entry)/(entry-sl);feedback(ratio>=1.5,ratio>=1.5?'做得好！你有明確進場、停損、止盈，而且計畫風報比至少 1:1.5。這不代表一定會獲利。':'這次風報比偏低。試著調整 SL 或 TP，練習讓目標報酬至少是風險的 1.5 倍。')}
function simulate(){if(revealed)return;revealed=true;const outcome=selected==='buy'?'這次行情先回調再上漲，最後碰到預設止盈。':'這次做空方向與模擬趨勢相反，價格碰到預設停損。';$('outcome').innerHTML=`<div class="feedback ${selected==='buy'?'good':''}">${outcome}<p>重點不是每筆都贏，而是先設定 SL 與 TP，並接受結果。</p>${nextBtn('完成第五座金山 ▶')}</div>`;$('simulateBtn').disabled=true}
function ui(){$('progress').style.width=(completed.size/6*100)+'%';$('levels').innerHTML=names.map((n,i)=>`<button class="level ${i===stage?'active':''} ${completed.has(i)?'done':''}" onclick="go(${i})">${completed.has(i)?'✓ ':''}${i+1}. ${n}</button>`).join('');const lines=['先看時間與 K 棒，才知道自己在分析什麼。','高點、低點的變化，能幫助你看方向。','黃金線移到哪裡，就要知道它代表什麼。','做多與做空都要有理由，不能用猜的。','進場前先知道自己錯了會賠多少。','這是模擬盤，記得先規劃，再看結果。','恭喜！你完成了第五座金山！'];$('speech').textContent=lines[Math.min(stage,6)];let h='';switch(stage){case 0:h='<h2>第一關｜認識 XAUUSD 的 H1</h2>'+info('XAUUSD 是黃金對美元報價；H1 表示<b>每根 K 棒記錄 1 小時</b>。垂直的每日分隔線則用來辨認交易日，不是 K 棒本身。')+chart(up)+ask('H1 圖表中，一根 K 棒代表多久？',['一天','一小時','一分鐘','一星期'],1,'H1 就是 1 Hour，每根 K 棒代表一小時。');break;case 1:h='<h2>第二關｜找出行情方向</h2>'+info('上升：高點、低點逐步墊高；下降：高點、低點逐步降低；盤整：價格在區間內來回。')+`<div class="controls"><button class="outline small" onclick="chooseScenario(0)">行情 A</button><button class="outline small" onclick="chooseScenario(1)">行情 B</button><button class="outline small" onclick="chooseScenario(2)">行情 C</button></div><p id="scenarioLabel">${scenarios[scenario].name}</p><div id="chart">${chart(scenarios[scenario].data)}</div><div class="choices"><button class="choice" onclick="checkTrend('up')">上升</button><button class="choice" onclick="checkTrend('down')">下降</button><button class="choice" onclick="checkTrend('range')">盤整</button></div><div class="feedback" id="feedback">先觀察 K 棒的高低點，再選擇。</div>`;break;case 2:h='<h2>第三關｜看圖找支撐</h2>'+info('價格多次在相近的低點附近<b>止跌反彈</b>，我們稱那裡可能有支撐。支撐是區域，不是保證不會跌破的數字。')+chart(range)+ask('價格多次在 4020～4030 附近反彈，最合理的判斷是？',['這附近可能有支撐','價格一定繼續上漲','4050 一定是進場點'],0,'4020～4030 附近可能有支撐，但實際交易仍需要確認。');break;case 3:h='<h2>第四關｜選擇做多或做空</h2>'+info('先觀察這段<b>上升中的模擬 H1</b>。做多（Buy）是預期價格上漲；做空（Sell）是預期價格下跌。')+chart(up)+`<div class="side"><button data-side="buy" class="selected" onclick="chooseSide('buy')">▲ Buy 做多</button><button data-side="sell" onclick="chooseSide('sell')">▼ Sell 做空</button></div><div class="status" id="sideNote">做多（Buy）：預期後續上漲，停損應在進場下方。</div><div class="actions"><button class="gold" onclick="checkSide()">確認方向</button></div><div class="feedback" id="feedback">選方向後，導師會說明原因。</div>`;break;case 4:h='<h2>第五關｜自己設定進場、停損、止盈</h2>'+info('這裡練習<b>買進單</b>：SL 要在進場下方，TP 要在進場上方。改動數字，圖上的三條線會同步移動。')+`<div id="chart">${chart(up,{order:{entry,sl,tp}})}</div><div class="order"><label>進場價格<input id="entry" type="number" value="${entry}" oninput="orderUpdate()"></label><label>停損 SL<input id="sl" type="number" value="${sl}" oninput="orderUpdate()"></label><label>止盈 TP<input id="tp" type="number" value="${tp}" oninput="orderUpdate()"></label></div><div class="feedback" id="explain">請調整數字，觀察進場、SL、TP 的關係。</div><button class="gold" id="check" onclick="orderCheck()">檢查交易計畫</button><div class="feedback" id="feedback">至少要知道進場理由、停損與止盈位置。</div>`;break;case 5:h='<h2>第六關｜黃金模擬實戰</h2>'+info('模擬行情已經走出一段上升趨勢。請選方向並按下「推進行情」。<b>這不是預測真實價格</b>，而是練習面對停損與止盈。')+chart(up)+`<div class="side"><button data-side="buy" class="selected" onclick="chooseSide('buy')">▲ Buy 做多</button><button data-side="sell" onclick="chooseSide('sell')">▼ Sell 做空</button></div><div class="status" id="sideNote">做多（Buy）：預期後續上漲，停損應在進場下方。</div><div class="actions"><button class="gold" id="simulateBtn" onclick="simulate()">▶ 推進模擬行情</button></div><div id="outcome"></div>`;break;default:h=`<div style="text-align:center"><h2>🏆 第五座金山通關！</h2><img src="mentor.png" alt="礦工導師" style="max-width:160px"><p class="result">${player}，完成 ${completed.size}/6 關！</p><p>你已練習 H1 看圖、趨勢、支撐、做多做空、SL/TP 與模擬交易。</p><p>恭喜完成五座金山！返回主遊戲查看恐龍圖鑑與成績單。</p><button class="gold" onclick="go(0)">再次練習</button></div>`}$('content').innerHTML=h;if(stage===6){parent.postMessage({type:'mountain5',action:'completed'},'*')} }
$('reset').onclick=()=>{if(confirm('清除第五座金山試玩進度？')){completed.clear();save();go(0)}};ui();
</script></body></html>
